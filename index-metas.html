<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  
  <!-- SEO & Social Media -->
  <title>MetasPro — Gestão de Metas & Performance</title>
  <meta name="description" content="MetasPro — Sistema avançado de gestão de metas, indicadores e remuneração variável. Acompanhe sua performance em tempo real.">
  <meta name="author" content="Moura Leite Desenvolvimento">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@typehaus/metropolis@12.0.0/400.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@typehaus/metropolis@12.0.0/500.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@typehaus/metropolis@12.0.0/600.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@typehaus/metropolis@12.0.0/700.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@typehaus/metropolis@12.0.0/800.css">
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Favicon placeholder -->
  <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body>
  <!-- Application Root -->
  <div id="app" class="app-root">
    <!-- Initial Loading State -->
    <div style="height: 100vh; display: flex; align-items: center; justify-content: center; background: #fdfdfd;">
      <div style="text-align: center;">
        <div style="width: 40px; height: 40px; border: 3px solid rgba(245, 136, 58, 0.2); border-top-color: #F5883A; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px;"></div>
        <p style="font-family: 'Inter', sans-serif; color: #6b7280; font-size: 0.9rem; font-weight: 500;">Carregando MetasPro...</p>
      </div>
    </div>
  </div>

  <!-- Loading Animation Style -->
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <!-- Navigation Helper -->
  <script>
    if (!window.location.hash) {
      window.location.hash = '#metas';
    }
  </script>

  <!-- MSAL.js para Autenticação Microsoft -->
  <script src="https://alcdn.msauth.net/browser/2.35.0/js/msal-browser.min.js"></script>

  <!-- EmailJS SDK -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <!-- SheetJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase SDKs (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-storage-compat.js"></script>

  <!-- Firebase Config local -->
  <script src="js/firebase-config.js"></script>

  <!-- Application Scripts -->
  <script src="js/data.js"></script>
  <script src="js/graph.js?v=2"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/metas.js?v=2"></script>
  <script src="js/remuneracao.js"></script>
  <script src="js/configuracoes.js"></script>
  <script src="js/relatorios.js"></script>
  <script src="js/lembretes-graph.js"></script>
  <script src="js/lembretes-engine.js"></script>
  <script src="js/lembretes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
